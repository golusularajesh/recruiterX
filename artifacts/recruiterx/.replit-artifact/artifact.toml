kind = "web"
previewPath = "/"
title = "RecruiterX by AV HUB"
description = "A responsive website for RecruiterX by AV HUB, introducing its US staffing training and supervised internship program, admissions information, and Recruitment as a Service offerings for staffing companies."
version = "1.0.0"
id = "artifacts/recruiterx"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24017

[services.development]
run = "pnpm --filter @workspace/recruiterx run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/recruiterx", "run", "build" ]
serve = "static"
publicDir = "artifacts/recruiterx/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24017"
BASE_PATH = "/"
